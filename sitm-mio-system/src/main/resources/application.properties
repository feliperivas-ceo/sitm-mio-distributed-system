spring.application.name=sitm-mio-system

# ── Base de datos (H2 en dev) ──────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:sitmmiodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Servidor ICE ───────────────────────────────────────────────────────────
sitmmio.ice.port=10000

# ── Persistencia CSV ───────────────────────────────────────────────────────
sitmmio.csv.path=data/datagramas_live.csv
sitmmio.csv.flush-every=50

# ── Web ────────────────────────────────────────────────────────────────────
server.port=8080
