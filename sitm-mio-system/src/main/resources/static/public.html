<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SITM-MIO - Estado del Sistema</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { background: #F8F9FA; }
    .header-pub { background: linear-gradient(135deg,#1565C0,#0D47A1); color:white; padding:20px 0; }
    .ruta-card { border-left:5px solid; border-radius:8px; transition:transform .15s; }
    .ruta-card:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.1); }
    .status-badge { font-size:.9rem; padding:5px 12px; border-radius:20px; font-weight:600; }
    #mapaPublico { height:350px; border-radius:12px; overflow:hidden; }
    .estacion-item { padding:8px 12px; border-left:3px solid #3498DB; margin-bottom:6px; background:white; border-radius:0 6px 6px 0; }
  </style>
</head>
<body>

<div class="header-pub mb-4">
  <div class="container d-flex align-items-center justify-content-between">
    <div>
      <h2 class="mb-0 fw-bold"><i class="bi bi-bus-front-fill me-2"></i>SITM-MIO Cali</h2>
      <p class="mb-0 opacity-75">Estado en tiempo real del Sistema de Transporte Masivo</p>
    </div>
    <div class="text-end">
      <a href="/index.html" class="btn btn-outline-light btn-sm">
        <i class="bi bi-lock me-1"></i>Panel Operadores
      </a>
    </div>
  </div>
</div>

<div class="container">
  <!-- KPIs -->
  <div class="row g-3 mb-4" id="kpiPublico"></div>

  <!-- Mapa -->
  <div class="card shadow-sm mb-4">
    <div class="card-header fw-bold bg-white">
      <i class="bi bi-map-fill me-2 text-primary"></i>Mapa de Buses en Tiempo Real
    </div>
    <div class="card-body p-2">
      <div id="mapaPublico"></div>
    </div>
  </div>

  <!-- Estado por ruta -->
  <h5 class="fw-bold mb-3"><i class="bi bi-signpost-2 me-2 text-primary"></i>Estado por Ruta</h5>
  <div class="row g-3 mb-4" id="rutasPublico"></div>

  <!-- Consulta de llegada -->
  <div class="card shadow-sm mb-5">
    <div class="card-header fw-bold bg-white">
      <i class="bi bi-clock-fill me-2 text-success"></i>Estimación de Llegada
    </div>
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Ruta</label>
          <select id="pubRuta" class="form-select"></select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Estación / Parada</label>
          <select id="pubEstacion" class="form-select"></select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-success w-100" onclick="consultarLlegada()">
            <i class="bi bi-search me-1"></i>Consultar
          </button>
        </div>
      </div>
      <div id="resultadoLlegada" class="mt-3"></div>
    </div>
  </div>

  <footer class="text-center text-muted small pb-4">
    SITM-MIO &copy; 2025 · Municipio de Santiago de Cali · Actualización cada 10 segundos
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let mapaPublico = null;
let capaBusesPublico = null;
let rutas = [];
let estaciones = [];

async function iniciar() {
  await cargarResumen();
  await cargarRutas();
  await cargarEstaciones();
  initMapaPublico();
  await cargarBusesPublico();
  setInterval(cargarBusesPublico, 10000);
}

async function cargarResumen() {
  try {
    const r = await fetch('/api/public/resumen');
    const d = await r.json();
    document.getElementById('kpiPublico').innerHTML = [
      { label:'Buses en servicio', valor: d.busesActivos, icono:'bi-bus-front-fill', color:'success' },
      { label:'Total rutas', valor: d.totalRutas, icono:'bi-signpost-2-fill', color:'primary' },
      { label:'Estaciones', valor: d.totalEstaciones, icono:'bi-geo-alt-fill', color:'info' },
      { label:'Sistema', valor: d.sistemaOperativo ? 'OPERANDO' : 'SUSPENDIDO', icono:'bi-activity', color: d.sistemaOperativo ? 'success' : 'danger' }
    ].map(k => `
      <div class="col-6 col-md-3">
        <div class="card text-center shadow-sm border-0">
          <div class="card-body py-3">
            <i class="bi ${k.icono} fs-2 text-${k.color}"></i>
            <div class="fs-3 fw-bold mt-1">${k.valor}</div>
            <div class="text-muted small">${k.label}</div>
          </div>
        </div>
      </div>`).join('');
  } catch(_) {}
}

async function cargarRutas() {
  try {
    const r = await fetch('/api/public/rutas');
    rutas = await r.json();
    const sel = document.getElementById('pubRuta');
    sel.innerHTML = '<option value="">Seleccionar ruta...</option>';
    rutas.forEach(rt => {
      const o = document.createElement('option');
      o.value = rt.rutaId; o.textContent = rt.rutaId + ' - ' + rt.nombre;
      sel.appendChild(o);
    });
    document.getElementById('rutasPublico').innerHTML = rutas.map(rt => `
      <div class="col-md-4">
        <div class="card ruta-card shadow-sm h-100" style="border-color:${rt.color}">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <span class="badge mb-1" style="background:${rt.color}">${rt.rutaId}</span>
                <h6 class="fw-bold mb-1">${rt.nombre}</h6>
              </div>
              <span class="status-badge ${rt.estado === 'OPERANDO' ? 'bg-success' : 'bg-danger'} text-white">
                ${rt.estado === 'OPERANDO' ? '✅' : '❌'} ${rt.estado}
              </span>
            </div>
            <hr class="my-2"/>
            <div class="d-flex justify-content-between small">
              <span><i class="bi bi-bus-front me-1"></i>${rt.busesActivos}/${rt.totalBuses} activos</span>
              <span><i class="bi bi-speedometer me-1"></i>${rt.velocidadPromedio} km/h</span>
            </div>
            <div class="progress mt-2" style="height:6px">
              <div class="progress-bar" style="width:${rt.totalBuses>0?Math.round(rt.busesActivos/rt.totalBuses*100):0}%;background:${rt.color}"></div>
            </div>
          </div>
        </div>
      </div>`).join('');
  } catch(_) {}
}

async function cargarEstaciones() {
  try {
    const r = await fetch('/api/estaciones');
    estaciones = await r.json();
    const sel = document.getElementById('pubEstacion');
    sel.innerHTML = '<option value="">Seleccionar estación...</option>';
    estaciones.forEach(e => {
      const o = document.createElement('option');
      o.value = e.id; o.textContent = e.nombre + (e.tipo === 'ESTACION_MAYOR' ? ' 🏢' : ' 🚏');
      sel.appendChild(o);
    });
  } catch(_) {}
}

function initMapaPublico() {
  mapaPublico = L.map('mapaPublico').setView([3.4516, -76.5320], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18 }).addTo(mapaPublico);
  capaBusesPublico = L.layerGroup().addTo(mapaPublico);
  // Estaciones
  estaciones.forEach(e => {
    if (!e.latitud) return;
    L.circleMarker([e.latitud, e.longitud], {
      radius: e.tipo === 'ESTACION_MAYOR' ? 8 : 5,
      fillColor: e.tipo === 'ESTACION_MAYOR' ? '#2C3E50' : '#7F8C8D',
      color: 'white', weight: 2, fillOpacity: 0.9
    }).bindPopup(`<b>${e.nombre}</b><br>${e.tipo}`).addTo(mapaPublico);
  });
}

async function cargarBusesPublico() {
  try {
    const r = await fetch('/api/buses');
    const buses = await r.json();
    if (!capaBusesPublico) return;
    capaBusesPublico.clearLayers();
    buses.forEach(b => {
      if (!b.latitud) return;
      const color = b.prioridad === 'ALTA' ? '#E74C3C' : b.prioridad === 'MEDIA' ? '#E67E22' : '#27AE60';
      const m = L.circleMarker([b.latitud, b.longitud], {
        radius: 7, fillColor: color, color: 'white', weight: 2, fillOpacity: 0.95
      });
      m.bindPopup(`<b>Bus ${b.id}</b><br>Ruta: ${b.rutaId || '-'}<br>Estado: ${b.estado}<br>Vel: ${b.velocidad ? b.velocidad.toFixed(1)+' km/h' : 'N/A'}`);
      capaBusesPublico.addLayer(m);
    });
  } catch(_) {}
}

async function consultarLlegada() {
  const rutaId = document.getElementById('pubRuta').value;
  const estacionId = document.getElementById('pubEstacion').value;
  if (!rutaId || !estacionId) {
    document.getElementById('resultadoLlegada').innerHTML =
      '<div class="alert alert-warning">Selecciona ruta y estación</div>';
    return;
  }
  try {
    const r = await fetch(`/api/public/rutas/${rutaId}/llegada/${estacionId}`);
    const d = await r.json();
    const div = document.getElementById('resultadoLlegada');
    if (d.estimacionMinutos === -1) {
      div.innerHTML = `<div class="alert alert-warning"><i class="bi bi-exclamation-triangle me-2"></i>${d.mensaje}</div>`;
    } else {
      div.innerHTML = `
        <div class="alert alert-success">
          <div class="row align-items-center">
            <div class="col-auto">
              <i class="bi bi-clock-fill fs-1 text-success"></i>
            </div>
            <div class="col">
              <h5 class="mb-1">Próximo bus en aproximadamente <strong>${d.estimacionMinutos} minuto${d.estimacionMinutos !== 1 ? 's' : ''}</strong></h5>
              <div class="small">
                Bus <strong>${d.busId}</strong> · Velocidad promedio: ${d.velocidadPromedio} km/h · Distancia: ${d.distanciaKm} km<br>
                Estación: <strong>${d.estacion}</strong>
              </div>
            </div>
          </div>
        </div>`;
    }
  } catch(_) {
    document.getElementById('resultadoLlegada').innerHTML =
      '<div class="alert alert-danger">Error consultando estimación</div>';
  }
}

iniciar();
</script>
</body>
</html>
