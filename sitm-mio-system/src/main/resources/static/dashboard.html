<!DOCTYPE html>
<html>
<head>

    <title>SITM-MIO Dashboard</title>

    <meta charset="UTF-8">

    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>

        #map {
            height: 100vh;
        }

    </style>

</head>

<body>

<div id="map"></div>

<script>

    const map = L.map('map')
        .setView([3.4516, -76.5320], 12);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
    ).addTo(map);

    const socket = new WebSocket(
        "ws://localhost:8080/bus-monitor"
    );

    const markers = {};

    socket.onmessage = function(event) {

        const data = JSON.parse(event.data);

        const position = [data.lat, data.lon];

        if(markers[data.busId]) {

            markers[data.busId]
                .setLatLng(position);

        } else {

            markers[data.busId] =
                L.marker(position)
                 .addTo(map)
                 .bindPopup("Bus: " + data.busId);
        }
    };

</script>

</body>
</html>
