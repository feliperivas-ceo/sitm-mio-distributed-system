<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro de Control SITM-MIO</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef2f5;
        }

        header {
            background: #17324d;
            color: white;
            padding: 18px 25px;
        }

        nav {
            background: white;
            padding: 12px 25px;
            border-bottom: 1px solid #ddd;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 8px;
        }

        .active {
            background: #0052cc;
            color: white;
        }

        .hidden {
            display: none;
        }

        .layout {
            display: grid;
            grid-template-columns: 3fr 1fr;
            height: calc(100vh - 120px);
        }

        #map {
            height: 100%;
        }

        #panel {
            padding: 20px;
            background: white;
            overflow-y: auto;
        }

        .event {
            background: #f8f9fa;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 8px;
        }

        .low { border-left: 5px solid #2ecc71; }
        .medium { border-left: 5px solid #ffaa00; }
        .high { border-left: 5px solid #ff4d4d; }

        .analytics {
            padding: 25px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select, input {
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .table-container {
            max-height: 380px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        canvas {
            background: white;
            padding: 12px;
            border-radius: 8px;
            max-height: 320px;
        }
    </style>
</head>

<body>

<header>
    <h2>Centro de Control SITM-MIO</h2>
</header>

<nav>
    <button id="btnMapa"
            class="active"
            onclick="mostrarSeccion('mapa')">
        Monitoreo en tiempo real
    </button>

    <button id="btnAnalitica"
            onclick="mostrarSeccion('analitica')">
        Analítica histórica
    </button>
</nav>

<section id="seccionMapa">
    <div class="layout">
        <div id="map"></div>

        <aside id="panel">
            <h3>Eventos recientes</h3>
            <div id="events"></div>
        </aside>
    </div>
</section>

<section id="seccionAnalitica" class="analytics hidden">

    <h2>Velocidades promedio por ruta y mes</h2>

    <div class="filters">
        <select id="version">
            <option value="monolitico">Monolítica</option>
            <option value="concurrente" selected>Concurrente</option>
            <option value="distribuido">Distribuida</option>
        </select>

        <input id="routeId"
               placeholder="Ruta: ejemplo 131"/>

        <input id="month"
               placeholder="Mes: ejemplo 2019-05"/>

        <button class="active"
                onclick="cargarHistorico()">
            Consultar
        </button>
    </div>

    <div class="kpis">
        <div class="card">
            <strong>Versión</strong>
            <div id="kpiVersion">-</div>
        </div>

        <div class="card">
            <strong>Resultados</strong>
            <div id="kpiResultados">0</div>
        </div>

        <div class="card">
            <strong>Registros analizados</strong>
            <div id="kpiRegistros">0</div>
        </div>

        <div class="card">
            <strong>Tiempo de referencia</strong>
            <div id="kpiTiempo">-</div>
        </div>
    </div>

    <div class="card">
        <canvas id="chartVelocidad"></canvas>
    </div>

    <div class="card table-container">
        <table>
            <thead>
            <tr>
                <th>Ruta</th>
                <th>Mes</th>
                <th>Velocidad promedio</th>
                <th>Registros</th>
            </tr>
            </thead>

            <tbody id="tablaHistorica"></tbody>
        </table>
    </div>

</section>

<script>
    function mostrarSeccion(seccion) {
        const mapa = document.getElementById("seccionMapa");
        const analitica = document.getElementById("seccionAnalitica");

        const btnMapa = document.getElementById("btnMapa");
        const btnAnalitica = document.getElementById("btnAnalitica");

        mapa.classList.toggle("hidden", seccion !== "mapa");
        analitica.classList.toggle("hidden", seccion !== "analitica");

        btnMapa.classList.toggle("active", seccion === "mapa");
        btnAnalitica.classList.toggle("active", seccion === "analitica");

        if (seccion === "analitica") {
            cargarHistorico();
        }
    }

    const map = L.map("map")
        .setView([3.4516, -76.5320], 12);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
    ).addTo(map);

    const markers = {};

    const socket = new WebSocket(
        `ws://${window.location.host}/bus-monitor`
    );

    socket.onmessage = function(event) {
        const data = JSON.parse(event.data);

        const position = [data.lat, data.lon];

        if (markers[data.busId]) {
            markers[data.busId].setLatLng(position);
        } else {
            markers[data.busId] =
                L.marker(position)
                    .addTo(map)
                    .bindPopup("Bus: " + data.busId);
        }
    };

    const events = [
        { type: "GPS actualizado", priority: "low" },
        { type: "Puertas abiertas", priority: "medium" },
        { type: "Motor averiado", priority: "high" }
    ];

    document.getElementById("events").innerHTML =
        events.map(event => `
            <div class="event ${event.priority}">
                <strong>${event.type}</strong>
                <p>Prioridad: ${event.priority.toUpperCase()}</p>
            </div>
        `).join("");

    let chartVelocidad = null;

    async function cargarHistorico() {
        const version = document.getElementById("version").value;
        const routeId = document.getElementById("routeId").value;
        const month = document.getElementById("month").value;

        const query = new URLSearchParams({
            version,
            routeId,
            month
        });

        try {
            const response = await fetch(
                `/api/analytics/historico/velocidades?${query}`
            );

            const data = await response.json();

            document.getElementById("kpiVersion").textContent =
                data.version;

            document.getElementById("kpiResultados").textContent =
                data.cantidadResultados;

            document.getElementById("kpiRegistros").textContent =
                Number(data.totalRegistros).toLocaleString();

            await cargarTiempoReferencia(version);

            renderizarTabla(data.resultados);
            renderizarGrafico(data.resultados);

        } catch (error) {
            alert("No fue posible cargar los resultados históricos.");
        }
    }

    async function cargarTiempoReferencia(version) {
        const response = await fetch(
            "/api/analytics/historico/benchmark"
        );

        const benchmark = await response.json();

        let texto = "-";

        if (version === "monolitico") {
            texto = `${benchmark.monolitico.tiempoMs} ms`;
        }

        if (version === "concurrente") {
            texto =
                `${benchmark.concurrente.tiempoMs} ms · ` +
                `${benchmark.concurrente.speedup}x`;
        }

        if (version === "distribuido") {
            texto =
                `Worker máximo: ` +
                `${benchmark.distribuido.worker2TiempoMs} ms`;
        }

        document.getElementById("kpiTiempo").textContent = texto;
    }

    function renderizarTabla(resultados) {
        const tbody = document.getElementById("tablaHistorica");

        tbody.innerHTML = resultados.map(row => `
            <tr>
                <td>${row.routeId}</td>
                <td>${row.month}</td>
                <td>${row.averageSpeedKmh.toFixed(2)} km/h</td>
                <td>${Number(row.count).toLocaleString()}</td>
            </tr>
        `).join("");
    }

    function renderizarGrafico(resultados) {
        const ctx =
            document.getElementById("chartVelocidad");

        if (chartVelocidad) {
            chartVelocidad.destroy();
        }

        const primeros = resultados.slice(0, 25);

        chartVelocidad = new Chart(ctx, {
            type: "bar",
            data: {
                labels: primeros.map(row =>
                    `${row.routeId} · ${row.month}`
                ),
                datasets: [{
                    label: "Velocidad promedio (km/h)",
                    data: primeros.map(row =>
                        row.averageSpeedKmh
                    )
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }
</script>

</body>
</html>
